name: Source quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-analyze:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit source export
        run: python3 scripts/audit_export.py
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Compile app and tests without signing or launching
        run: ./scripts/build.sh check
      - name: Analyze native bridges and helper
        run: |
          for source in AWDLHelper/main.m Mos/Companion/TrackpadTouchBridge.m Mos/Companion/NativeGestureBridge.m; do
            xcrun clang --analyze -fobjc-arc -fblocks -Werror \
              -mmacosx-version-min=13.0 -Xanalyzer -analyzer-output=text "$source"
          done
